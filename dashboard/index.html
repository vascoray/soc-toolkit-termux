<!DOCTYPE html>
<html>
<head>
<title>POCKET SOC MOBILE v1.6.1 - King Vasco</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#000;color:#0f0;font-family:monospace;padding:15px;margin:0}
h1{color:#0f0;border-bottom:2px solid #0f0;font-size:18px}
h2{color:#0f0;font-size:16px}
.alert{color:#ffa500;margin:3px 0;font-size:14px}
.ok{color:#00ff00}
</style>
</head>
<body>
<h1>POCKET SOC MOBILE v1.6.1 - King Vasco</h1>
<h2>THREAT ALERTS - LIVE</h2>
<div id="threats"><div class="ok">Loading...</div></div>
<script>
function loadThreats(){
 fetch('report.csv').then(r=>{
   if(!r.ok) throw new Error('No report yet. Run Option 1 first');
   return r.text()
 }).then(data=>{
   let lines = data.split('\n').slice(1).filter(l=>l.trim()!="")
   let rows = lines.map(r=>`<div class="alert">[HIGH] ${r}</div>`).join('')
   document.getElementById('threats').innerHTML = rows || '<div class="ok">No threats detected</div>'
 }).catch(e=>{
   document.getElementById('threats').innerHTML = `<div class="alert">Error: ${e.message}</div>`
 })
}
loadThreats();
setInterval(loadThreats,3000); // refresh every 3s
</script>
</body>
</html>
